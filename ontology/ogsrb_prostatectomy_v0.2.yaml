# OG-SRB-Prostatectomy ontology configuration
# Version 0.2 — research prototype
#
# Important:
# - This schema is derived from SARAS MESAD-Real action labels.
# - It is not yet a clinically validated surgical ontology.
# - Tool/action/target mappings and contradiction rules require expert review.
# - Legacy fields are retained where practical so the existing pipeline can be adapted
#   without a complete rewrite.

meta:
  version: "0.2"
  status: "research_prototype_expert_review_required"
  source_dataset: "SARAS MESAD-Real (RARP)"
  procedure: "robot_assisted_radical_prostatectomy"
  ontology_scope: "post_hoc_action_and_workflow_benchmark"
  clinical_validation: "pending"
  snomed_linked: false
  terminology_status: "unverified_candidate_codes"
  phase_model_status: "dataset_derived_proxy_not_clinical_ground_truth"
  notes:
    - "Action labels are treated as dataset observations, not complete descriptions of the operation."
    - "Generic actions do not provide enough anatomical evidence to assign a specific phase."
    - "Phase transitions allow local backtracking because surgeons may revisit an earlier step."
    - "No global contradiction pair is treated as clinically valid without scope and expert review."

# Source recordings were acquired at 30 FPS, while released action annotations are sampled
# at approximately 1 FPS. Segment duration must therefore be calculated from the released
# annotation sampling rate rather than from the source-video frame rate.
temporal_metadata:
  source_video_fps: 30
  annotation_sampling_fps: 1
  segment_duration_seconds: null
  segment_duration_status: "must_be_set_by_preprocessing_configuration"

# -----------------------------------------------------------------------------
# Entity vocabularies
# -----------------------------------------------------------------------------

# "tools" is retained as the legacy field name used by the current code.
# The SNOMED identifiers below are candidates only and must not be presented as validated.
tools:
  - id: grasper
    entity_type: instrument
    snomed_candidate: "SCTID:129395002"
    terminology_status: "unverified_candidate"

  - id: monopolar_scissors
    entity_type: instrument
    snomed_candidate: "SCTID:129394003"
    terminology_status: "unverified_candidate"

  - id: clip_applier
    entity_type: instrument
    snomed_candidate: "SCTID:129452003"
    terminology_status: "unverified_candidate"

  - id: suction_irrigator
    entity_type: instrument
    snomed_candidate: "SCTID:129458009"
    terminology_status: "unverified_candidate"

  - id: needle_driver
    entity_type: instrument
    snomed_candidate: "SCTID:129433002"
    terminology_status: "unverified_candidate"

  - id: specimen_bag
    entity_type: surgical_device
    snomed_candidate: "SCTID:706767009"
    terminology_status: "unverified_candidate"

entity_types:
  anatomical_structures:
    - vas_deferens
    - seminal_vesicle
    - mesocolon
    - bladder_neck
    - prostate
    - urethra
    - bladder

  generic_targets:
    - generic_tissue

  biological_fluids:
    - blood

  surgical_materials:
    - suture_thread

  visual_phenomena:
    - smoke_plume

# Legacy broad target vocabulary. It contains anatomical and non-anatomical targets because
# the existing evaluator expects one flat list.
tissues:
  - generic_tissue
  - blood
  - smoke_plume
  - vas_deferens
  - seminal_vesicle
  - mesocolon
  - bladder_neck
  - prostate
  - urethra
  - suture_thread
  - bladder

# -----------------------------------------------------------------------------
# Dataset action mappings
# -----------------------------------------------------------------------------
#
# "tool" and "tissue" are retained as legacy singular fields.
# "allowed_tools" and "targets" are the preferred extensible fields.
# "phase_vote: false" means the label must not independently determine the phase.

actions:
  - id: PullingTissue
    verb: pulling
    tool: grasper
    allowed_tools: [grasper]
    tissue: generic_tissue
    targets: [generic_tissue]
    target_type: generic_target
    phase_applicability: any
    phase_vote: false
    mapping_status: "dataset_assumption_expert_review_required"

  - id: CuttingTissue
    verb: cutting
    tool: monopolar_scissors
    allowed_tools: [monopolar_scissors]
    tissue: generic_tissue
    targets: [generic_tissue]
    target_type: generic_target
    phase_applicability: any
    phase_vote: false
    mapping_status: "dataset_assumption_expert_review_required"

  - id: ClippingTissue
    verb: clip_application
    tool: clip_applier
    allowed_tools: [clip_applier]
    tissue: generic_tissue
    targets: [generic_tissue]
    target_type: generic_target
    phase_applicability: any
    phase_vote: false
    mapping_status: "dataset_assumption_expert_review_required"

  - id: SuckingBlood
    verb: suction
    tool: suction_irrigator
    allowed_tools: [suction_irrigator]
    tissue: blood
    targets: [blood]
    target_type: biological_fluid
    event: blood_present
    phase_applicability: any
    phase_vote: false
    mapping_status: "dataset_assumption_expert_review_required"

  - id: SuckingSmoke
    verb: suction
    tool: suction_irrigator
    allowed_tools: [suction_irrigator]
    tissue: smoke_plume
    targets: [smoke_plume]
    target_type: visual_phenomenon
    event: smoke_present
    phase_applicability: any
    phase_vote: false
    mapping_status: "dataset_assumption_expert_review_required"

  - id: PullingVasDeferens
    verb: pulling
    tool: grasper
    allowed_tools: [grasper]
    tissue: vas_deferens
    targets: [vas_deferens]
    target_type: anatomical_structure
    phase: vas_deferens_seminal_vesicle_dissection
    phase_vote: true
    mapping_status: "dataset_derived_expert_review_required"

  - id: ClippingVasDeferens
