    targets: [seminal_vesicle]
    target_type: anatomical_structure
    phase: vas_deferens_seminal_vesicle_dissection
    phase_vote: true
    mapping_status: "dataset_derived_expert_review_required"

  - id: ClippingSeminalVesicle
    verb: clip_application
    tool: clip_applier
    allowed_tools: [clip_applier]
    tissue: seminal_vesicle
    targets: [seminal_vesicle]
    target_type: anatomical_structure
    phase: vas_deferens_seminal_vesicle_dissection
    phase_vote: true
    mapping_status: "dataset_derived_expert_review_required"

  - id: CuttingSeminalVesicle
    verb: cutting
    tool: monopolar_scissors
    allowed_tools: [monopolar_scissors]
    tissue: seminal_vesicle
    targets: [seminal_vesicle]
    target_type: anatomical_structure
    phase: vas_deferens_seminal_vesicle_dissection
    phase_vote: true
    mapping_status: "dataset_derived_expert_review_required"

