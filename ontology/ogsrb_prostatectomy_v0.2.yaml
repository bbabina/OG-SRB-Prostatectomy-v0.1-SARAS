# -----------------------------------------------------------------------------
# Dataset-derived proxy phases
# -----------------------------------------------------------------------------
# These phases support benchmarking. They must not be described as universally fixed RARP
# phases or as independently annotated clinical ground truth.

phases:
  - id: mesocolon_mobilization
    order: 1
    actions: [CuttingMesocolon]

  - id: vas_deferens_seminal_vesicle_dissection
    order: 2
    actions:
      - PullingVasDeferens
      - ClippingVasDeferens
      - CuttingVasDeferens
      - PullingSeminalVesicle
      - ClippingSeminalVesicle
      - CuttingSeminalVesicle

  - id: bladder_neck_dissection
    order: 3
    actions: [BladderNeckDissection, PullingBladderNeck, ClippingBladderNeck]

  - id: prostate_dissection
    order: 4
    actions: [PullingProstate, CuttingProstate]

  - id: urethra_dissection
    order: 5
    actions: [UrethraDissection]

  - id: specimen_bagging
    order: 6
    legacy_aliases: [specimen_extraction]
    actions: [BaggingProstate]

  - id: bladder_anastomosis
    order: 7
    actions: [BladderAnastomosis, CuttingThread]

# These are observations inferred from action labels, not independently annotated events.
events:
  - id: blood_present
    type: observation
    evidenced_by: [SuckingBlood]
    inference_strength: indirect
    note: "Suction of blood does not by itself prove active bleeding."

  - id: smoke_present
    type: observation
    evidenced_by: [SuckingSmoke]
    inference_strength: indirect

# -----------------------------------------------------------------------------
# Relations
# -----------------------------------------------------------------------------

# Legacy requires(Action, Tool) relation.
# These mappings represent the canonical instrument assumed from the dataset label semantics;
# they are not independent instrument observations.
requires:
  - [PullingTissue, grasper]
  - [CuttingTissue, monopolar_scissors]
  - [ClippingTissue, clip_applier]
  - [SuckingBlood, suction_irrigator]
  - [SuckingSmoke, suction_irrigator]
  - [PullingVasDeferens, grasper]
  - [ClippingVasDeferens, clip_applier]
  - [CuttingVasDeferens, monopolar_scissors]
  - [PullingSeminalVesicle, grasper]
  - [ClippingSeminalVesicle, clip_applier]
  - [CuttingSeminalVesicle, monopolar_scissors]
  - [CuttingMesocolon, monopolar_scissors]
  - [BladderNeckDissection, monopolar_scissors]
  - [PullingBladderNeck, grasper]
  - [ClippingBladderNeck, clip_applier]
  - [PullingProstate, grasper]
  - [CuttingProstate, monopolar_scissors]
  - [BaggingProstate, specimen_bag]
  - [UrethraDissection, monopolar_scissors]
  - [CuttingThread, monopolar_scissors]
  - [BladderAnastomosis, needle_driver]

# Legacy acts_on(Action, Target) relation.
# The primary target is retained here for compatibility. Multi-target relations are expressed
# separately under "additional_targets".
acts_on:
  - [PullingTissue, generic_tissue]
  - [CuttingTissue, generic_tissue]
  - [ClippingTissue, generic_tissue]
  - [SuckingBlood, blood]
  - [SuckingSmoke, smoke_plume]
  - [PullingVasDeferens, vas_deferens]
  - [ClippingVasDeferens, vas_deferens]
  - [CuttingVasDeferens, vas_deferens]
  - [PullingSeminalVesicle, seminal_vesicle]
  - [ClippingSeminalVesicle, seminal_vesicle]
  - [CuttingSeminalVesicle, seminal_vesicle]
  - [CuttingMesocolon, mesocolon]
  - [BladderNeckDissection, bladder_neck]
  - [PullingBladderNeck, bladder_neck]
  - [ClippingBladderNeck, bladder_neck]
  - [PullingProstate, prostate]
  - [CuttingProstate, prostate]
  - [BaggingProstate, prostate]
  - [UrethraDissection, urethra]
  - [CuttingThread, suture_thread]
  - [BladderAnastomosis, bladder_neck]

additional_targets:
  - [BladderAnastomosis, urethra]

# Soft transition policy recommended for the benchmark.
# The current decoder may continue to read "phase_order" as the legal-transition graph.
phase_transition_policy:
  mode: soft_local_backtracking
  allow_stay: true
  allow_adjacent_forward: true
  allow_adjacent_backward: true
  allow_nonadjacent_transitions: false
  recommended_costs:
    stay: 0.0
    adjacent_forward: 0.1
    adjacent_backward: 0.5
  note: "Backward transitions are permitted but penalised; they are not treated as impossible."

# Legacy legal-transition graph: stay, adjacent forward, and adjacent backward.
phase_order:
  - [mesocolon_mobilization, mesocolon_mobilization]
  - [mesocolon_mobilization, vas_deferens_seminal_vesicle_dissection]

  - [vas_deferens_seminal_vesicle_dissection, mesocolon_mobilization]
  - [vas_deferens_seminal_vesicle_dissection, vas_deferens_seminal_vesicle_dissection]
  - [vas_deferens_seminal_vesicle_dissection, bladder_neck_dissection]

  - [bladder_neck_dissection, vas_deferens_seminal_vesicle_dissection]
  - [bladder_neck_dissection, bladder_neck_dissection]
  - [bladder_neck_dissection, prostate_dissection]

  - [prostate_dissection, bladder_neck_dissection]
  - [prostate_dissection, prostate_dissection]
  - [prostate_dissection, urethra_dissection]

  - [urethra_dissection, prostate_dissection]
  - [urethra_dissection, urethra_dissection]
  - [urethra_dissection, specimen_bagging]

  - [specimen_bagging, urethra_dissection]
  - [specimen_bagging, specimen_bagging]
  - [specimen_bagging, bladder_anastomosis]

  - [bladder_anastomosis, specimen_bagging]
  - [bladder_anastomosis, bladder_anastomosis]

# No unscoped, globally enforced contradiction pairs are considered clinically validated.
# Leaving this legacy list empty prevents the evaluator from reporting "0% contradictions"
# merely because a small set of hand-written phase-distance pairs was removed.
contradicts: []

# Structured candidate rules for future implementation.
# They require instrument identity and time scope, which the current segment-level labels may
# not provide. Therefore they must not be flattened into global segment-level contradictions.
contradiction_rules:
  - id: same_instrument_cutting_vs_clipping
    left_verbs: [cutting, dissection]
    right_verbs: [clip_application]
    scope: same_instrument_instance_same_timepoint
    severity: hard
    evaluable_with_current_annotations: false
    validation_status: "expert_review_required"

  - id: same_instrument_cutting_vs_suturing
    left_verbs: [cutting, dissection]
    right_verbs: [suturing]
    scope: same_instrument_instance_same_timepoint
    severity: hard
    evaluable_with_current_annotations: false
    validation_status: "expert_review_required"

  - id: same_instrument_clipping_vs_suturing
    left_verbs: [clip_application]
    right_verbs: [suturing]
    scope: same_instrument_instance_same_timepoint
    severity: hard
    evaluable_with_current_annotations: false
    validation_status: "expert_review_required"

  - id: same_instrument_suction_vs_cutting
    left_verbs: [suction]
    right_verbs: [cutting, dissection]
    scope: same_instrument_instance_same_timepoint
    severity: hard
    evaluable_with_current_annotations: false
    validation_status: "expert_review_required"

  - id: phase_distance_is_not_a_contradiction
    rule_type: modeling_guidance
    statement: "Actions associated with distant phases are not automatically contradictory within a segment."
    severity: advisory
    validation_status: "recommended"

# Suggested evaluator labels so generated metrics are not overstated.
metric_semantics:
  requirement_satisfaction:
    preferred_name: canonical_tool_mapping_conformance
    limitation: "Tool is deterministically derived from the action label unless predicted independently."

  acts_on_consistency:
    preferred_name: canonical_target_mapping_conformance
    limitation: "Target is deterministically derived from the action label unless predicted independently."

  ontology_factuality:
    preferred_name: schema_vocabulary_conformance

  contradiction_rate:
    preferred_name: validated_rule_violation_rate
    limitation: "Report only rules that have an explicit scope and expert validation status."

  step_ordering_consistency:
    preferred_name: proxy_phase_transition_consistency
    limitation: "Phases are action-derived proxies and allow legitimate local backtracking."
